name: 更新赚钱资讯
on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点运行
  workflow_dispatch:       # 也可手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 爬取赚钱资讯
        run: |
          pip install requests beautifulsoup4 feedparser -q

          cat << 'EOF' > update.py
          import requests, json, re, datetime
          from bs4 import BeautifulSoup

          articles = []
          sources = [
            {"name": "知乎", "url": "https://www.zhihu.com/", "type": "web"},
            {"name": "小红书", "url": "https://www.xiaohongshu.com/", "type": "web"},
            {"name": "微博", "url": "https://weibo.com/", "type": "web"},
            {"name": "36kr", "url": "https://36kr.com/", "type": "rss", "rss": "https://36kr.com/feed"},
            {"name": "少数派", "url": "https://sspai.com/", "type": "rss", "rss": "https://sspai.com/feed"},
          ]

          # 搜索赚钱相关关键词
          keywords = ["副业", "赚钱", "创业", "商机", "月入", "副业收入", "AI副业"]
          today = datetime.date.today().isoformat()

          # 示例：从搜索API获取（需根据实际调整）
          # 这里用占位数据，实际部署时替换为真实爬虫
          articles = [
            {"title": "AI副业新风口：月入过万的10种可行方案",
             "source": "知乎", "url": "https://www.zhihu.com/",
             "summary": "2024年AI浪潮下，普通人可通过AI写作、AI绘图、AI视频等方式开启副业。",
             "category": "AI", "tags": ["AI副业", "月入过万"], "date": today},
            {"title": "小红书带货最新玩法：素人从0到月入3万实战记录",
             "source": "小红书", "url": "https://www.xiaohongshu.com/",
             "summary": "一位普通宝妈的带货日记，从选品到引流转化全流程复盘。",
             "category": "电商", "tags": ["小红书", "带货"], "date": today},
          ]

          data = {"updated": today, "articles": articles}
          with open("articles.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"更新了 {len(articles)} 条资讯")
          EOF

          python3 update.py

      - name: 提交更新
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add articles.json
          git diff --quiet && echo "无变化" || git commit -m "自动更新资讯 $(date +%Y-%m-%d)"
          git push
