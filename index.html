<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赚钱资讯站</title>
  <style>
    :root {
      --primary: #FF6B35;
      --bg: #0D1117;
      --card: #161B22;
      --text: #E6EDF3;
      --text-dim: #8B949E;
      --border: #30363D;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 2rem; text-align: center; }
    .header h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #FF6B35, #FF9A3C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--text-dim); font-size: 0.9rem; }
    .header .stats { margin-top: 1rem; display: flex; justify-content: center; gap: 2rem; }
    .header .stat { text-align: center; }
    .header .stat .num { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    .header .stat .label { font-size: 0.8rem; color: var(--text-dim); }
    .filters { padding: 1rem 2rem; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(255,107,53,0.1); }
    .search-box { margin-left: auto; }
    .search-box input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 1rem; border-radius: 20px; outline: none; width: 200px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .source-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .source-tab { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; transition: all 0.2s; }
    .source-tab:hover, .source-tab.active { border-color: var(--primary); color: var(--primary); }
    .articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    .article { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: all 0.2s; cursor: pointer; }
    .article:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,53,0.15); }
    .article .source-tag { display: inline-block; background: rgba(255,107,53,0.15); color: var(--primary); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; margin-bottom: 0.8rem; }
    .article .title { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 0.8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .article .summary { font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1rem; }
    .article .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-dim); }
    .article .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .article .tag { background: var(--bg); padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
    .article .meta-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(255,107,53,0.15);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-decoration: none;
      flex-shrink: 0;
    }
    .article .meta-link:hover {
      background: rgba(255,107,53,0.3);
    }
    .article .meta { flex-wrap: wrap; gap: 4px; }

    .empty { text-align: center; padding: 4rem; color: var(--text-dim); }
    .empty .icon { font-size: 3rem; margin-bottom: 1rem; }
    .footer { text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 3rem; }
    .update-time { color: var(--text-dim); font-size: 0.8rem; }
    .loading { display: none; text-align: center; padding: 2rem; color: var(--text-dim); }
    @media (max-width: 768px) { .articles { grid-template-columns: 1fr; } .filters { flex-direction: column; } .search-box { margin-left: 0; width: 100%; } .search-box input { width: 100%; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 赚钱资讯站</h1>
    <p>自动收集全网赚钱、副业、商机资讯，每日更新</p>
    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">--</div><div class="label">条资讯</div></div>
      <div class="stat"><div class="num" id="sourceCount">--</div><div class="label">个来源</div></div>
      <div class="stat"><div class="num" id="updateTime">--</div><div class="label">更新时间</div></div>
    </div>
  </div>

  <div class="filters">
    <span style="color:var(--text-dim);font-size:0.85rem;">分类:</span>
    <button class="filter-btn active" data-category="全部">全部</button>
    <button class="filter-btn" data-category="副业">副业</button>
    <button class="filter-btn" data-category="创业">创业</button>
    <button class="filter-btn" data-category="投资">投资</button>
    <button class="filter-btn" data-category="电商">电商</button>
    <button class="filter-btn" data-category="AI">AI</button>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索资讯...">
    </div>
  </div>

  <div class="container">
    <div class="source-tabs" id="sourceTabs"></div>
    <div class="loading" id="loading">⏳ 加载中...</div>
    <div class="articles" id="articles"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="icon">🔍</div>
      <div>暂无相关资讯</div>
    </div>
  </div>

  <div class="footer">
    <p>由 GitHub Actions 自动更新 · 最后更新: <span id="footerTime">--</span></p>
    <p><a href="https://adammo01.github.io/money-news/platforms.html" style="color:var(--primary);">📋 开发激励与接单平台汇总</a></p>
    <p style="margin-top:0.5rem;"><a href="https://github.com/adammo01/money-news" style="color:var(--primary);">源码地址</a> · 基于 AI 辅助生成</p>
  </div>

  <script>
    let allArticles = [];
    let currentCategory = '全部';
    let currentSource = '全部';

    async function loadArticles() {
      try {
        const res = await fetch('articles.json');
        const data = await res.json();
        allArticles = data.articles || [];
        render();
      } catch (e) {
        document.getElementById('articles').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败，请稍后刷新</div></div>';
      }
    }

    function getSources() {
      const sources = [...new Set(allArticles.map(a => a.source))];
      return ['全部', ...sources];
    }

    function filterArticles() {
      return allArticles.filter(a => {
        const matchCat = currentCategory === '全部' || a.category === currentCategory;
        const matchSrc = currentSource === '全部' || a.source === currentSource;
        const kw = document.getElementById('searchInput').value.toLowerCase();
        const matchSearch = !kw || a.title.toLowerCase().includes(kw) || (a.summary||'').toLowerCase().includes(kw);
        return matchCat && matchSrc && matchSearch;
      });
    }

    function render() {
      const filtered = filterArticles();
      const container = document.getElementById('articles');
      const empty = document.getElementById('empty');

      document.getElementById('totalCount').textContent = allArticles.length;
      document.getElementById('sourceCount').textContent = getSources().length - 1;
      document.getElementById('footerTime').textContent = allArticles[0]?.date || '--';

      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      container.innerHTML = filtered.map(a => `
        <div class="article" onclick="window.open('${a.url}', '_blank')">
          <span class="source-tag" title="${a.url}">${a.source}</span>
          <div class="title">${a.title}</div>
          <div class="summary">${a.summary || ''}</div>
          <div class="meta">
            <div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
            <a href="${a.url}" target="_blank" class="meta-link" onclick="event.stopPropagation()">🔗 查看原文</a>
            <span>${a.date}</span>
          </div>
        </div>
      `).join('');

      // source tabs
      document.getElementById('sourceTabs').innerHTML = getSources().map(s =>
        `<button class="source-tab ${currentSource===s?'active':''}" onclick="currentSource='${s}';render()">${s}</button>`
      ).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        render();
      });
    });

    document.getElementById('searchInput').addEventListener('input', render);

    loadArticles();
  </script>
</body>
</html>
